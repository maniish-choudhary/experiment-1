<!-- Copy Link Button Component -->
<button 
  id="copyLinkBtn" 
  class="copy-btn" 
  data-link="https://example.com"
  aria-label="Copy link to clipboard"
>
  <!-- Link Icon (SVG) -->
  <svg class="icon icon-link" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
  </svg>
  
  <span id="btnText">Copy Link</span>
</button>

<!-- Optional Styling -->
<style>
  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    background-color: #2563eb; /* Blue button */
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
  }

  .copy-btn:hover {
    background-color: #1d4ed8;
  }

  .copy-btn:active {
    transform: scale(0.98);
  }

  /* Success State Styling */
  .copy-btn.success {
    background-color: #16a34a; /* Green button on success */
  }

  .icon {
    transition: transform 0.2s ease;
  }
</style>

<!-- Modern JavaScript Logic -->
<script>
  document.getElementById('copyLinkBtn').addEventListener('click', async function() {
    const btn = this;
    const btnText = document.getElementById('btnText');
    const linkToCopy = btn.getAttribute('data-link');

    try {
      // Use the modern asynchronous Clipboard API
      await navigator.clipboard.writeText(linkToCopy);
      
      // Update UI to show success
      btn.classList.add('success');
      btnText.textContent = 'Copied!';
      btn.setAttribute('aria-live', 'polite'); // Accessibility notice

      // Reset button back to default after 2 seconds
      setTimeout(() => {
        btn.classList.remove('success');
        btnText.textContent = 'Copy Link';
      }, 2000);

    } catch (err) {
      console.error('Failed to copy text: ', err);
      btnText.textContent = 'Failed to copy';
    }
  });
</script>
